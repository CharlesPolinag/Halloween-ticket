<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Decisions Halloween Ticket</title>
<style>
  @page {
    size: A4;
    margin: 0;
  }
  body {
    margin: 0;
    padding: 20mm;
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .ticket {
    border: 3px dashed #f7941e;
    border-radius: 10px;
    padding: 40px;
    max-width: 600px;
    margin: 0 auto;
    background: #2b1e3d;
    text-align: center;
  }
  h1 {
    color: #f7941e;
    font-size: 36px;
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  h2 {
    color: #90ee90;
    font-size: 24px;
    margin: 0 0 30px;
    border-bottom: 1px solid #444;
    padding-bottom: 15px;
  }
  .detail {
    font-size: 18px;
    line-height: 2;
    margin: 10px 0;
  }
  .highlight {
    color: #ffd700;
    font-weight: bold;
    font-size: 20px;
  }
  .admit {
    margin: 30px 0;
    font-size: 22px;
    border: 2px solid #f7941e;
    display: inline-block;
    padding: 10px 25px;
    letter-spacing: 3px;
  }
  @media print {
    body { background: white; color: black; }
    .ticket { background: white; border-color: #333; }
    h1 { color: #d35400; }
    h2 { color: #27ae60; }
    .highlight { color: #c0392b; }
  }
</style>
</head>
<body>

<div class="ticket">
  <h1>🕸️ POUR DECISIONS’ SPOOKY PARTY 🕷️</h1>
  <h2>HALLOWEEN POOL PARTY</h2>

  <p class="detail"><strong>📅 DATE:</strong> 31 October</p>
  <p class="detail"><strong>⏰ TIME:</strong> 9:00 PM</p>
  <p class="detail"><strong>📍 VENUE:</strong><br>
  BLOCK 1, LOT 1, TAMARIND ST.<br>
  GREENWOODS, CAINTA, RIZAL</p>

  <div class="admit">ADMIT ONE</div>

  <p class="detail highlight">DOOR CHARGE: ₱999.00</p>
  <p class="detail">🥂 UNLI COCKTAILS & MOCKTAILS</p>
</div>

</body>
</html>
